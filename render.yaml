services:
  - type: web
    name: pdf-compare
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: pdf-data
      mountPath: /var/data
      sizeGB: 1
